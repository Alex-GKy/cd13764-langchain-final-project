[project]
name = "health-chatbot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.4.1",
    "haystack-ai>=2.23.0",
    "langchain>=1.2.7",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.1",
    "langchain-openai>=1.1.7",
    "langchain-text-splitters>=1.1.0",
    "langgraph>=1.0.7",
    "langgraph-cli[inmem]>=0.4.12",
    "mlflow>=3.9.0",
    "nltk>=3.9.2",
    "pypdf>=6.6.2",
    "python-dotenv>=1.2.1",
    "reportlab>=4.4.9",
    "streamlit>=1.53.1",
    "tavily-python>=0.7.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/health_chatbot"]
